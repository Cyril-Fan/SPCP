assumptions:
  prompt_flow: 12 prompted blocks. Text source bank in blocks 1–6 projects to visual
    prompts; visual source bank in blocks 7–12 projects to text prompts. Two shared
    linear layers; replace context slots at each block. No class/image aggregation
    or residual addition.
  text_branches: 'Fig. 2: learned student contexts + ordinary class-name suffix; frozen
    teacher uses the full three-level taxonomy sentence.'
  initialization: First four shallow text context tokens use phrase embeddings; remaining
    tokens and deeper source prompts use Normal(0, 0.02).
  taxonomy_origin: Independently generated and frozen before viewing reproduction
    scores, retaining Table 1 examples. Not the unavailable author ChatGPT-5.1 output.
  support: 16 shots, seeds 1/2/3, ceil-half sorted integer labels; APPLeNet public
    split IDs. Exact paper identity is unconfirmed.
  recipe: Batch 16, AMP, cosine learning-rate decay with one warmup epoch, CoOp-style
    random crop/flip; missing in paper.
  loss_reduction: Mean 1−cosine for classes and images; teachers detached; cross-entropy
    mean over support batch.
  checkpoint: Fixed final epoch; no score-based checkpoint choice.
  class_text: Underscores become spaces; seven RSICD compound labels, MLRSNet harbor&port
    and swimmimg_pool use explicit readable leaf names in the frozen taxonomy JSON.
    Label IDs and support IDs are unchanged.
