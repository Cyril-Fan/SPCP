paper:
  title: Semantics-preserving cross-modal prompting for generalizable remote sensing scene classification
  method: SPCP
  status: working manuscript; no acceptance or publication claim
model:
  backbone: ViT-B/16
  prompt_length: 16
  depth: 12
  shallow_layers: 6
  context_init: a photo of a
  init_std: 0.02
  interaction: directional_shared_projection
  alignment_metric: cosine
  alignment_weight: 1.0
  text_alignment_weight: 1.0
  image_alignment_weight: 1.0
data:
  dataset: PatternNet
  split: ../assets/raw/splits/patternnet.json
  image_root: ../external/datasets/PatternNet
  taxonomy: ../assets/raw/taxonomies/patternnet.json
  shot: 16
  base_fraction: 0.5
  base_rounding: ceil
  task: cd
  use_val: false
  role: source
  eval_only: false
  split_sha256: db971a7a485c8c1d2d2e6e962e8bbadb5ec36977b4947c42bdad3c0168db29e4
train:
  seeds:
  - 1
  - 2
  - 3
  epochs: 10
  other_task_epochs: 10
  optimizer: Adam
  learning_rate: 0.0025
  weight_decay: 1.0e-05
  batch_size: 16
  eval_batch_size: 64
  workers: 4
  scheduler: cosine
  warmup_epochs: 1
  warmup_learning_rate: 1.0e-05
  crop_min: 0.08
  horizontal_flip: 0.5
  precision: amp
  grad_scaler_initial_scale: 128
  device: cuda
  max_minutes_per_run: 110
  checkpoint_selection: final_epoch
runtime:
  clip_root: ../external/original_clip
  output_root: ../runs
  progress_interval: 10
  clip_checkpoint: ../external/ViT-B-16.pt
  clip_checkpoint_sha256: 5806e77cd80f8b59890b7e101eabd078d9fb84e6937f9e85e4ecb61988df416f
  clip_source_hashes:
    clip/__init__.py: d7930eb290ebed432116795c91473200d098451a94c0aedd4ae0f934f97955e8
    clip/clip.py: f42d29d6ff24715a4d3dd6860c820ea21a3839e3a45b42ad92c7bc37019cd3c6
    clip/model.py: c0ba5cb62eafbf21e6c4e861e9caf6933d1c7e82313d37f953cd2c1ae85f78de
    clip/simple_tokenizer.py: d1b09f10ed3d1e2c343619cb98cbfacb92363dd8607526a43aa7fe2d60d15bad
  clip_bpe_sha256: 924691ac288e54409236115652ad4aa250f48203de50a9e4722a6ecd48d6804a
  phase: formal
  require_source_selection: false
  save_scores: true
  save_features: false
  diagnostic_gradient_batches: 1
  experiment_protocol: spcp.cd.v1
assumptions:
  prompt_flow: 12 prompted blocks. Text source bank in blocks 1–6 projects to visual prompts; visual source
    bank in blocks 7–12 projects to text prompts. Two shared linear layers; replace context slots at each
    block. No class/image aggregation or residual addition.
  text_branches: Learned context with class-name suffix for students; fixed full hierarchy sentence for
    frozen text references.
  initialization: First four shallow text context tokens use phrase embeddings; remaining tokens and deeper
    source prompts use Normal(0, 0.02).
  taxonomy_origin: Fixed class-name hierarchy descriptions; prepared before inspecting experiment scores.
    Stored class/template text is part of the protocol.
  support: 16 shots, seeds 1/2/3, ceil-half sorted labels for B2N; fixed APPLeNet split IDs.
  recipe: Batch 16, AMP, Adam, cosine learning-rate decay with one warmup epoch, random resized crop and
    horizontal flip.
  loss_reduction: Mean 1−cosine for classes and images; teachers detached; cross-entropy mean over support
    batch.
  checkpoint: Fixed final epoch; no score-based checkpoint choice.
  class_text: Underscores become spaces; seven RSICD compound labels, MLRSNet harbor&port and swimmimg_pool
    use explicit readable leaf names in the frozen taxonomy JSON. Label IDs and support IDs are unchanged.
method:
  name: SPCP
  enabled: true
  eta: 0.5
  neighbors: 3
  geometry_epsilon: 0.2
  duplicate_epsilon: 1.0e-06
  control: difference
  version: 1
targets:
- dataset: RSICD
  split: ../assets/raw/splits/rsicd.json
  image_root: ../external/datasets/RSICD
  taxonomy: ../assets/raw/taxonomies/rsicd.json
  shot: 16
  base_fraction: 0.5
  base_rounding: ceil
  task: b2n
  use_val: false
  role: target
  eval_only: true
  split_sha256: 9d31238de620ab89152bd9ed2897ff8b3552d7bddf88a9c00b0e342c86a96a97
- dataset: NWPU-RESISC45
