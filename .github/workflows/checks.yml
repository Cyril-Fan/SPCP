name: Full SPCP CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.20'
          cache: pip
      - run: python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/prepare_protocol_assets.py
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests
