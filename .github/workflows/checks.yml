name: Full SPCP CPU checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: micromamba-shell {0}
    steps:
      - uses: actions/checkout@v4
      # setup-python has no Ubuntu 22.04 build for the recorded Python patch version.
      - uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-name: spcp
          create-args: python=3.8.20 pip
          init-shell: none
          cache-environment: true
      - run: python -c "import sys; assert sys.version_info[:3] == (3, 8, 20), sys.version"
      - run: python -m pip install torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/prepare_protocol_assets.py
      - run: python scripts/check_release.py
      - run: python -m unittest discover -s tests
